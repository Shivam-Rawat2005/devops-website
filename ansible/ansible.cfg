[defaults]
roles_path = roles
remote_user = ubuntu
interpreter_python = auto_silent
forks = 10
stdout_callback = default
result_format = yaml
# New EC2 servers have unknown host keys. The pipeline runs on a fresh machine each time,
# so it cannot keep a known_hosts file; servers are reached only by their Elastic IPs.
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
