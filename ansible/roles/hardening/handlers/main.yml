---
# Both handlers listen to "Restart SSH": the config is checked first, and SSH
# is only restarted if the check passes, so a typo can never lock us out.
- name: Check the SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart SSH

- name: Restart the SSH service
  ansible.builtin.service:
    name: ssh
    state: restarted
  listen: Restart SSH

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
