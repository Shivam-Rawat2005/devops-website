# Delete everything Terraform created for one environment, so it stops costing money.
# Actions tab -> Destroy -> Run workflow, and type the environment name again to confirm.
# Rebuilding later is just running the Deploy workflow again.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to delete"
        required: true
        type: choice
        options: [dev, prod]
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    if: inputs.confirm == inputs.environment
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform destroy
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform destroy -input=false -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars"
          echo "### ${ENVIRONMENT} destroyed" >> "$GITHUB_STEP_SUMMARY"
