# The main pipeline. Runs on every push to main:
#   test -> build and push images -> deploy to dev -> (approval) -> deploy to prod
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/api
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the API tests
        run: npm test

  build:
    name: Build and push images
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Check out the code (with recent history for the deployments list)
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Work out the image tag and registry
        id: vars
        run: |
          {
            echo "image_tag=${GITHUB_SHA::7}"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the Recent deployments list from git history
        run: node scripts/generate-deployments.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the website image
        uses: docker/build-push-action@v6
        with:
          context: app/website
          push: true
          tags: ${{ steps.vars.outputs.registry }}/devops-website-web:${{ steps.vars.outputs.image_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: app/api
          push: true
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.image_tag }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          tags: ${{ steps.vars.outputs.registry }}/devops-website-api:${{ steps.vars.outputs.image_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy-dev:
    name: Dev
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read

  deploy-prod:
    name: Prod
    needs: [build, deploy-dev]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read
